<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fieldcast Invoice Desk</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1b1f24}
header{background:#14213d;color:#fff;padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:600}
main{max-width:1050px;margin:24px auto;padding:0 20px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:10px;padding:18px 20px;margin-bottom:18px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;font-size:14px}
.badge{padding:3px 9px;border-radius:12px;font-size:12px;font-weight:600}
.approved{background:#dcfce7;color:#166534}.in_review{background:#fef3c7;color:#92400e}.rejected{background:#fee2e2;color:#991b1b}
.ok{color:#166534}.fail{color:#b91c1c}button,.btn{background:#14213d;color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none;font-size:14px}
.red{background:#b91c1c}.green{background:#15803d}input{padding:6px;border:1px solid #ccc;border-radius:5px}
.flash{background:#e0f2fe;padding:10px;border-radius:6px;margin-bottom:12px}.muted{color:#6b7280;font-size:13px}
</style></head><body>
<header><a href="/">Fieldcast Invoice Desk</a><span class="muted" style="color:#cbd5e1">extract → validate → review → export</span></header>
<main>{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block body %}{% endblock %}</main></body></html>
